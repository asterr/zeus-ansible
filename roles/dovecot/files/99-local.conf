# Managed by Ansible (zeus-ansible dovecot role). Dovecot 2.4 syntax.
# Overrides the stock conf.d files; loaded last.

ssl = required
ssl_server_cert_file = /etc/dovecot/private/dovecot.pem
ssl_server_key_file = /etc/dovecot/private/dovecot.key

# IMAPS only; plain IMAP disabled
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
